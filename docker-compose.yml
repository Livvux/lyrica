services:
  lyrica:
    build: .
    image: lyrica:latest
    container_name: lyrica
    restart: unless-stopped
    # Nur auf Tailscale-IP lauschen → kein öffentlicher Zugriff
    ports:
      - "100.99.236.56:3000:3000"
    volumes:
      - lyrica-tmp:/app/tmp/lyrica
    env_file: .env.production
    environment:
      # Node.js Heap: verhindert GC-Druck bei langen Renders
      NODE_OPTIONS: "--max-old-space-size=8192"
      # Chrome mit --no-sandbox (Root-User in Docker)
      CHROME_EXECUTABLE: "/usr/local/bin/chrome-wrapper"
    # seccomp deaktivieren + SYS_ADMIN: Chrome braucht beides für Namespacing
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
    # Chrome nutzt /dev/shm intensiv
    shm_size: 2gb
    # Ressourcen: 10 von 12 CPUs, 16 GB RAM-Limit
    deploy:
      resources:
        limits:
          cpus: "10"
          memory: 32G
        reservations:
          cpus: "2"
          memory: 512M
    # Chromium öffnet viele File Descriptors
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

volumes:
  lyrica-tmp:
